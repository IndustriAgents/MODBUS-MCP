[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "modbus-mock-server"
version = "0.1.0"
description = "A lightweight Modbus TCP mock server for testing."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "MODBUS Project" },
]
dependencies = [
  # Tested on 3.11.4 and 3.12.1. 3.10.0 starts, but its datastore answers reads
  # past the 100-entry tables with short replies instead of exception 2 (Illegal
  # Data Address); 3.13 replaced the datastore API this mock is built on.
  "pymodbus>=3.11,<3.13",
]

[project.scripts]
modbus-mock-server = "modbus_local_server:main"

[dependency-groups]
dev = [
  "ruff>=0.16",
]

[tool.hatch.build.targets.wheel]
include = [
  "modbus_local_server.py",
  "README.md",
]

[tool.hatch.build.targets.sdist]
include = [
  "modbus_local_server.py",
  "README.md",
]


[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# T20: log to stderr instead of print().
select = ["E", "F", "W", "I", "B", "UP", "T20"]
