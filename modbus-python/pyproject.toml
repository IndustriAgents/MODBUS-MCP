[project]
name = "modbus-mcp"
version = "0.1.0"
description = "An MCP server that standardizes and contextualizes Modbus data, enabling seamless integration of AI agents with industrial IoT systems."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # mcp 2.x removed mcp.server.fastmcp, which this server is built on.
    "mcp[cli]>=1.6.0,<2",
    # Tested with every pymodbus minor release from 3.9.2 to 3.15; 3.10 renamed
    # the unit-id keyword (slave -> device_id), which cli.py handles at runtime.
    "pymodbus>=3.9.2,<3.16",
    "python-dotenv>=1.1.0",
]

[project.scripts]
modbus-mcp = "modbus_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
