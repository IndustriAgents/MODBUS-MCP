name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Both uv projects commit their uv.lock and are installed with --locked, so CI
# fails if a lockfile drifts from its pyproject.toml. The server's tests include
# integration tests that start the mock device from ../modbus-mock-server (with
# `uv run --locked`, on a free port) and drive the real server over stdio with
# the MCP client SDK, so no external device is needed.
jobs:
  server:
    name: MCP server (modbus-python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modbus-python
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies from uv.lock
        run: uv sync --locked

      - name: Lint (ruff check)
        run: uv run --locked ruff check

      - name: Check formatting (ruff format)
        run: uv run --locked ruff format --check

      - name: Byte-compile sources
        run: uv run --locked python -m compileall -q src

      - name: Import package, list registered tools, resolve entry point
        run: |
          uv run --locked python - <<'EOF'
          import asyncio
          from importlib.metadata import entry_points

          from modbus_mcp.cli import mcp

          tools = asyncio.run(mcp.list_tools())
          print(f"{len(tools)} tools registered: {', '.join(sorted(t.name for t in tools))}")
          undocumented = [t.name for t in tools if not (t.description or "").strip()]
          assert not undocumented, f"tools without a description: {undocumented}"

          (ep,) = entry_points(group="console_scripts", name="modbus-mcp")
          assert callable(ep.load()), ep
          print("console script modbus-mcp ->", ep.value)
          EOF

      - name: Tests (unit, and integration against the mock device)
        run: uv run --locked pytest -v

  server-lowest:
    # The lockfile pins the newest releases. This job installs the LOWEST
    # version allowed for every direct dependency in pyproject.toml (mcp 1.12.3,
    # pymodbus[serial] 3.9.2, python-dotenv 1.1.0, anyio 4.5, pydantic 2.8,
    # exceptiongroup 1.0.2 on Python 3.10, and pytest 8.0) and runs the same
    # tests, so the declared floors stay honest. pymodbus 3.9 still uses `slave=`
    # and has pymodbus.payload, which the codec test compares against.
    name: MCP server on the lowest direct dependencies
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modbus-python
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install the lowest direct dependencies
        run: |
          uv venv --python 3.10 .venv
          # lowest-direct resolves transitive dependencies at their newest, and the
          # newest sse-starlette (via mcp) needs anyio 4.7; pin anyio to its own floor.
          uv pip install --resolution lowest-direct -e . "pytest>=8" "anyio==4.5.0"
          uv pip list | grep -Ei '^(mcp|pymodbus|python-dotenv|pyserial|anyio|pydantic|exceptiongroup|pytest) '

      - name: Tests (unit, and integration against the mock device)
        run: uv run --no-sync pytest -v

  mock:
    name: Mock device (modbus-mock-server)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modbus-mock-server
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies from uv.lock
        run: uv sync --locked

      - name: Lint (ruff check)
        run: uv run --locked ruff check

      - name: Check formatting (ruff format)
        run: uv run --locked ruff format --check

      - name: Byte-compile sources
        run: uv run --locked python -m compileall -q modbus_local_server.py

      # Builds the simulated datastore without binding a port, which catches a
      # pymodbus upgrade that breaks the mock before anyone tries to start it.
      # The server job's integration tests exercise the running mock over TCP.
      - name: Build datastore, check initial values, resolve entry point
        run: |
          uv run --locked python - <<'EOF'
          from importlib.metadata import entry_points

          import modbus_local_server as m

          device = m.build_context()[0]
          assert device.getValues(m.HOLDING_REGISTERS, 0, 10) == m.INITIAL_HOLDING
          assert device.getValues(m.INPUT_REGISTERS, 0, 9) == m.INITIAL_INPUTS
          assert device.getValues(m.HOLDING_REGISTERS, 0, 1) == [50]  # Valve Position
          print("datastore built; initial values at the documented addresses")

          (ep,) = entry_points(group="console_scripts", name="modbus-mock-server")
          assert callable(ep.load()), ep
          print("console script modbus-mock-server ->", ep.value)
          EOF

      # pyproject.toml allows pymodbus 3.11.1-3.12; uv.lock pins 3.12.1, which the
      # server job's integration tests run against. Start the mock on the lowest
      # allowed version too and check it over Modbus TCP.
      - name: Start the mock on the lowest direct dependencies and probe it
        run: |
          venv="${RUNNER_TEMP:-/tmp}/mock-lowest"
          uv venv --python 3.10 "$venv"
          VIRTUAL_ENV="$venv" uv pip install --resolution lowest-direct -e .
          VIRTUAL_ENV="$venv" uv pip list | grep -i '^pymodbus '
          "$venv/bin/python" - <<'EOF'
          import asyncio
          import socket
          from importlib.metadata import version

          from pymodbus.client import AsyncModbusTcpClient

          import modbus_local_server as m


          async def main() -> None:
              with socket.socket() as sock:  # a free port
                  sock.bind(("127.0.0.1", 0))
                  port = sock.getsockname()[1]
              server = asyncio.create_task(m.run_server("127.0.0.1", port, 0.2))
              client = AsyncModbusTcpClient("127.0.0.1", port=port)
              for _ in range(50):
                  if await client.connect():
                      break
                  await asyncio.sleep(0.1)
              hr = await client.read_holding_registers(0, count=10, device_id=1)
              assert hr.registers == m.INITIAL_HOLDING, hr
              edge = await client.read_holding_registers(99, count=1, device_id=1)
              assert not edge.isError(), edge
              past = await client.read_holding_registers(100, count=1, device_id=1)
              assert past.isError() and past.exception_code == 2, past
              ident = await client.read_device_information(read_code=3, device_id=1)
              assert ident.information[0] == b"Mock ICS", ident
              client.close()
              server.cancel()
              print(f"mock on pymodbus {version('pymodbus')}: values, table size and identity OK")


          asyncio.run(main())
          EOF
