blank_issues_enabled: false
contact_links:
  # Questions go to the suite-wide Discussions, which IndustriConnect's own
  # issue chooser also points to. If Discussions are enabled on this repo,
  # this link can move to https://github.com/IndustriAgents/MODBUS-MCP/discussions.
  - name: Question or usage help
    url: https://github.com/IndustriAgents/IndustriConnect/discussions
    about: Ask in the IndustriConnect Discussions about configuration, MCP clients, or connecting to your own Modbus equipment.
  - name: Model Context Protocol docs
    url: https://modelcontextprotocol.io
    about: Reference for MCP itself — transports, clients, and the tool interface.
  - name: Security vulnerability
    url: https://github.com/IndustriAgents/MODBUS-MCP/security/policy
    about: Report privately. Please do not open a public issue.
